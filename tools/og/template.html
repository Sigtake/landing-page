<!doctype html>
<meta charset="utf-8">
<title>OG card</title>
<style>
  /* Same faces and tokens the site serves (public/css/site.css), so cards and pages cannot drift apart. */
  @font-face { font-family:"Inter"; src:url("/public/fonts/inter-var-latin.woff2") format("woff2"); font-weight:100 900; font-display:block; }
  @font-face { font-family:"Figtree"; src:url("/public/fonts/figtree-var-latin.woff2") format("woff2"); font-weight:300 900; font-display:block; }
  @font-face { font-family:"JetBrains Mono"; src:url("/public/fonts/jetbrains-mono-var-latin.woff2") format("woff2"); font-weight:100 800; font-display:block; }

  :root {
    --page:#ffffff; --panel:#f5f7f9; --line:#e3e8ed; --ink:#0a0d12; --muted:#56677d;
    --teal:#2dd4bf; --stage:#e2f6f4;
    --app:#0f1115; --app-2:#151a22; --app-row:#10141b; --app-line:rgba(255,255,255,.07); --app-text:#b9c4d0;
    --critical:#f67171; --warning:#fbbf24; --routed:#44d4bf;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; background:var(--page); font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .card { position:relative; width:1200px; height:630px; overflow:hidden; display:grid; grid-template-columns:1fr 560px; column-gap:44px; padding:52px 40px 52px 64px; }
  .card.plain { grid-template-columns:1fr 440px; }
  .card.route { grid-template-columns:1fr 520px; }
  .card.plain .row { font-size:12.5px; gap:10px; }
  .left { display:flex; flex-direction:column; height:100%; }
  .brand img { width:152px; height:auto; display:block; }
  .block { margin:auto 0; }
  h1 { font-family:"Figtree"; font-weight:800; font-size:62px; line-height:.98; letter-spacing:-.045em; color:var(--ink); }
  .card.plain h1 { font-size:66px; }
  h1 em { font-style:normal; }
  p { margin-top:20px; font-size:21px; line-height:1.45; color:var(--muted); max-width:500px; text-wrap:balance; }

  .stage { border-radius:24px; background:var(--stage); padding:28px; display:flex; flex-direction:column; justify-content:center; gap:14px; }
  .win { border-radius:14px; background:var(--app); border:1px solid rgba(255,255,255,.06); box-shadow:0 24px 50px -28px rgba(9,40,44,.55); padding:20px 20px 22px; color:#f4f6f8; }
  .wtitle { font:700 20px/1.2 "Inter"; margin-bottom:14px; }
  .wtitle span { font-weight:400; color:#c9d1da; font-size:17px; margin-left:6px; }
  .ghead { display:flex; align-items:center; height:32px; padding:0 12px; border-radius:6px; background:var(--app-2); box-shadow:inset 0 0 0 1px var(--app-line); font:600 13px/1 "Inter"; letter-spacing:.04em; margin:12px 0 6px; }
  .rows { display:grid; gap:6px; }
  .row { position:relative; height:34px; display:flex; align-items:center; gap:12px; padding:0 14px 0 22px; border-radius:4px; background:var(--app-row); box-shadow:inset 0 0 0 1px var(--app-line); font:400 13px/1 "JetBrains Mono"; color:var(--app-text); white-space:nowrap; }
  .row::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; border-radius:4px 0 0 4px; background:var(--tab, var(--routed)); }
  .row.crit { --tab:var(--critical); }
  .row.ack { --tab:var(--warning); }
  .row .sep { color:#4f5b69; }
  .row .end { margin-left:auto; color:#fff; }
  .row .cnt { margin-left:auto; color:var(--critical); font-weight:700; }
  .row.dim { opacity:.55; }
  .total { display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:16px; border-top:1px solid rgba(255,255,255,.14); }
  .total span { font:700 19px/1 "Inter"; }
  .total b { font:800 46px/1 "Figtree"; letter-spacing:-.03em; }
  .chips { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .chip { height:42px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; font:500 14px/1 "Inter"; color:#2a3646; }
</style>

<div class="card" id="card">
  <div class="left">
    <div class="brand"><img src="/assets/plates/logo.png" alt=""></div>
    <div class="block">
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
  </div>
  <div class="stage" id="visual"></div>
</div>

<script type="module">
  const id = new URLSearchParams(location.search).get('card') || 'home';
  const card = (await (await fetch('cards.json')).json())[id];
  if (!card) throw new Error('unknown card: ' + id);

  document.getElementById('card').classList.add(card.layout);
  document.getElementById('title').innerHTML = card.titleHtml;
  document.getElementById('sub').textContent = card.sub;

  const row = (cls, a, b, end) => `<div class="row ${cls}"><span>${a}</span><span class="sep">|</span><span>${b}</span>${end || ''}</div>`;
  const visuals = {
    rows: () => `
      <div class="win">
        <div class="wtitle">Alerts</div>
        <div class="ghead">PAYMENTS</div>
        <div class="rows">
          ${row('crit dim', 'API', 'Payment webhook timeout')}
          ${row('crit dim', 'API', 'Payment webhook timeout')}
          ${row('crit', 'API', 'Payment webhook timeout', '<span class="cnt">×25</span>')}
        </div>
        <div class="ghead">PLATFORM</div>
        <div class="rows">
          ${row('', 'UPTIME', 'Database latency')}
          ${row('ack', 'SSL', 'Certificate expiring')}
        </div>
      </div>
      <div class="chips"><div class="chip">Slack</div><div class="chip">Email</div><div class="chip">Teams</div></div>`,
    stat: () => `
      <div class="win">
        <div class="wtitle">Your bill <span>· Early access</span></div>
        <div class="rows">${card.checks.map(c => `<div class="row"><span>${c}</span><span class="end">$0.00</span></div>`).join('')}</div>
        <div class="total"><span>Total per month</span><b>${card.stat}</b></div>
      </div>`,
    route: () => `
      <div class="win">
        <div class="wtitle">Routing</div>
        <div class="rows">
          <div class="row crit"><span>team_code</span><span class="sep">|</span><span>PAYMENTS</span><span class="end">→ Slack #alerts-prod</span></div>
          <div class="row"><span>team_code</span><span class="sep">|</span><span>PLATFORM</span><span class="end">→ Microsoft Teams</span></div>
          <div class="row ack"><span>team_code</span><span class="sep">|</span><span>WEB</span><span class="end">→ Email</span></div>
        </div>
      </div>`,
    plain: () => `
      <div class="win">
        <div class="rows">
          ${row('crit dim', 'API', 'Payment webhook timeout')}
          ${row('crit', 'API', 'Payment webhook timeout', '<span class="cnt">×25</span>')}
          ${row('', 'UPTIME', 'checkout down')}
          ${row('ack', 'SSL', 'Expires in 7 days')}
        </div>
      </div>`,
  };
  document.getElementById('visual').innerHTML = visuals[card.layout]();
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  document.documentElement.dataset.ready = '1';
</script>
